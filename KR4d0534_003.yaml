body:
  text: 詩之義本於諷諭蓋心欲有言而言不足以道志故假於辭焉而辭也者欲其諭難言之志也然語澀而俚意浮以近文采不足以動人立言易朽君子不由也余致力於斯甚久未嘗敢以易心為之蓋得於意者為難美而修於辭者不失之過則不及以是而輟者十八九嗚呼其難矣哉金臺集者友人合魯易之之詩也其詩百餘篇森然若開羣玉之府圭璋琮璜各有列位辭語至到而神與情詣動蕩激越可歌可舞信乎其能諭諸人者余讀之再過因歎賞不已遂書所見於其篇末云至正三年二月既望揭傒斯書至正九年夏至日伯頁台哈布哈觀于持志齋易之至京師以詩名雄諸公問其道塗之所經耳目之所屬山川風俗人情物態可喜可愕一發於詩然皆本諸性情徵諸政教而不為煙雲月露之歸追風雅之遺音振金石之逺響上而公卿大夫下而里閭韋布之士莫不稱之一時之善為詩者亦莫之能過也余得其金臺集若干首讀之彌月不厭古人云用功深者其收名也逺詎不信乎易之果囉羅人在中國西北數千萬里之外而能被服周公仲尼之道家故有閥閲勳勞可藉以取富貴而棄不就臞然一寒生專以詩鳴世亦奇偉不羣之士哉今居越云至正辛卯史官新安程文書右金臺稿若干卷果囉羅君易之之所製也易之自幼篤學為詩既長訪古河朔厯覽山川以達其趣八年之春余在京師與易之遇於故友會稽韓與玉氏相善也與玉能書時金華王子充為古文易之與二人偕來江南京師因目為江南三絶而易之所為詩尤傳誦士大夫間余既歸久之易之亦橐其稿以歸復與余相會於鄞則其友已傳刻之取一二篇以讀則慷慨悲歌而燕趙之風聲氣習猶可想見及觀承旨歐陽公祭酒李公侍講黃公故侍書虞公侍講揭文安公所為序引深評逺論唯恐其不傳也其有得於此可謂難矣且詩自漢魏而下至唐為盛而其間獨推杜甫氏以為不失風人之旨然其時先後若陳子昻髙適韋應物劉禹錫輩亦各名家蓋詩由人情生也情非有古今者特有至有不至爾是故越人之曲敕勒之歌其托興寫物非素工於辭者而操觚之士有不逮也何則情之所至而語至焉則不求工而自工也故余謂易之之詩如潁州老翁西曹郎巢湖新鄉媪新隄等篇撫事感懷若不經意而盡所欲言有得於風人之旨者當不謝於古人况其所工者復不下是兹固可信其必傳也雖然易之年未五十平生故人多列官于朝而當急賢之時其能久於窮乎韓子云天將和其聲以鳴國家之盛者意其有在於是則嗣而刻之尚未艾也余姑識斯語以俟至正十五年冬十月望浙河楊彞書易之金臺前稿余既序之矣及再至京師又得後稿一卷為之論昔在成周之世采詩以觀民風其大小之國千有八百西方之國豳得七篇秦得十篇而止夫以雍州之域實在王畿自豳秦而西未見有詩豈其風氣未開習俗不能以相通也歟易之果囉羅氏也彼其國在北庭西北金山之西去中國逺甚太祖皇帝取天下其名王與回紇最先來附至今百有餘年其人之散居四方者往往業詩書而工文章易之伯氏既登進士第易之乃泊然無意於仕進退藏句章山水之間其所為詩清麗而粹密學士大夫多傳誦之然則葛邏祿氏之能詩者自易之始此足以見我朝文化之洽無逺弗至雖成周之盛未之有也昔余客鄞為文送易之北來以為祖宗取天下豐功大業宜制樂歌薦諸郊廟易之之才足以為之聖君賢相制禮作樂豈終舍吾易之者哉臨川危素在京師金臺坊書
