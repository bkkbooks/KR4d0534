body:
  text: 金臺集題詩崇天門下聽臚傳臺閣聨翩四十年今日縣車歸故里杖藜擕酒落華前玉帶難圍老病身廟堂補報乏涓塵衰年作别情懷惡秉燭題詩贈故人愛君譚辯似縣河更喜交情古意多長使馬周貧作客令人千古媿常何百尺髙臺易水東千金曾此彀英雄君來却在承平日先筞詩壇第一功予既致政將歸濟南賦詩四章題金臺集後奉别易之良友抑以書予自媿云爾至正戊子三月望日華峰真逸張起巖書
