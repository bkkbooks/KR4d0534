front:
  text: 金臺集題詩崇天門下聽臚傳臺閣聨翩四十年今日縣車歸故里杖藜擕酒落華前玉帶難圍老病身廟堂補報乏涓塵衰年作别情懷惡秉燭題詩贈故人愛君談辨似縣河更喜交情古意多長使馬周貧作客令人千古愧常何百尺髙臺易水東千金曾此彀英雄君來却在承平日先策詩壇第一功
  hash: sha256:6513c6c28d21d4148fa0f217ef7a3b55396c58a4c7931b1e3056e86855c84f6e
  markers:
