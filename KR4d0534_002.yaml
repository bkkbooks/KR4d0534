餘里始建行都水監於鄆城以專治之少監蒲從善築隄建祠病民可念豫聞而哀之乃為作歌黃河決道時有清水先流至名曰漸水曹濮之人見此水皆遷居髙丘預避老人家住黃河邊黃茅縛屋三四椽有牛一具田一頃藝桑種榖終殘年年來河流失故道墊溺村墟決城堡人家墳墓無處尋千里放船行樹杪朝廷憂民恐為魚詔蠲徭役除田租大臣雜議拜都水設官開府臨青徐分監來時當十月河氷塞川天雨雪調夫十萬築新隄手足血流肌肉裂監官號令如雷風天寒日短難為功南村家家賣兒女要與河伯營祠宫陌上逢人相向哭漸水漫漫及曹濮流離凍餓何足論只恐新堤要重築昨朝移家上髙丘水來不到丘上頭但願皇天念赤子河清海晏三千秋劉舍人桃花馬歌青絲駿馬桃花色翠鞍玉轡黃金勒奚奴牽出不敢騎道上行人爭愛惜往時曽遇李將軍汗流赤血氣如雲朝刷黃河暮南粵沙場百戰成竒勛歸來無心伏槽櫪頓轡長鳴思奮力東家白面繡衣郎千金買去遊南陌昨朝挍獵向城隅萬人爭說天下無夜歸不怕灞陵尉玉鞭醉打蒼頭奴畫燭銀屏歡徹曙一朝金盡賔朋去可憐驕馬屬誰家斷韁猶繫階前樹君不見西家欵段三十年青芻滿櫪菽滿田老翁不識城下路騎看射獵南山邊贈沈元方歸吳興兼簡韓與玉春城飛絮曉紛紛金水河邊更送君闕下馬卿憐作客江南沈約最能文天圍斷岸歸帆逺水落黃河野樹分寄謝平生韓處士别來應是賦停雲贈空谷山人徐君歸武當五更鐘鳴天未曙六街馬蹄聲似雨露華滿屨霜滿衣束帶爭趨丞相府千鍾之祿萬户侯幾人空負平生愁鏡中緑髮漸垂素窗間白日如奔流誰念幽人在空谷癭木為冠草為服小甕春風紫术香長鑱落日黃精熟行歌偶到黃金臺坐看世事如浮埃長衢甲第換新主舊時燕子愁歸來忽憶紫霄峯下路倒跨青鸞獨歸去松華釀酒一千石結廬招我南山住送林庭立歸四明兼柬張子端兄弟徵君歸隱海東頭三月開帆江水流坐看浮雲知世態長歌落日送離愁平生不負楊臨賀此去端如馬少遊若見山中陶宰相白雲千里思悠悠庭立客賀相府相左遷獨逺送之其鄉多𢎞景故蹟草年滄海託交情最憶張家好弟兄清夜泛舟傳玉斚髙堂秉燭聽銀箏故人别去青山逺遊子忘歸白髮生眀月湖邊還有約一竿春水釣絲輕次韻趙祭酒城東宴集子期金河流水碧粼粼御栁烟消曙色新黃鳥只愁春去逺隔窗呼醒看花人童子將車候辟雍先生載酒出城東絲絲細雨春雲薄却恨羅衫怯曉風上東門外杏花開千樹紅雲繞石臺最憶奎章虞閣老白頭騎馬看花來鱸滿銀盤酒滿壺山童竹裏送行厨風流絶似蘭亭㑹留取他年作畫圖仙家髙館隔紅塵流水聯階竹樹新學士重來今白髮馮䦨空憶種花人碧草纎鐵藉翠裀酴醾釀熟十分春移尊更近池邊樹漉酒先生待掛巾十騎聯鑣入郭遲從教斜日過棠梨候門稚子牽衣笑今日先生有好詩國子監散學候日影到堂後梨樹杜陵野客戀京華日典春衣醉酒家徒步歸來情寂寞一年空負隔城花時諸公見招豫以疾不能赴贈謝尚禮歸盱江江左風流玉雪郎牙籖錦軸滿髙堂五言往往凌三謝八法翩翩逼二王芳草池塘春夢斷杏花風雨客窗涼平生狗監能知己奏賦他時入建章畫船緑樹映滄波撾鼓開船發御河作惡情懷唯仗酒落花時節況聞歌潮來别浦江聲急雲起南山雨氣多落日都門一分袂相思千里奈君何北邙山歌白樂天賜第履道坊既葬北邙敕命遊人至墳所者必酹酒至今墓前隙地泥潦北邙山髙雲嵯峨山前日日聞挽歌千金買穴望卿相不道洛陽人葬多長安歸來錦衣客昨日城南起新宅雕闌華礎滿前楹盡是當年墓邊石墓邊野老鬢如絲自言曽見築墳時轉頭石馬臥荆棘白楊蕭颯秋風悲白日西流水東逝眼見君家葬三世舊時隧道盡為田新墳苦作千年計寄語洛陽諸少年對酒莫惜黃金錢縱有穹碑勒勛業文章誇靡誰能傳君不見履道坊中白太傅留客髙堂醉歌舞至今三月看花人載酒去澆墳上土讀金太祖武元皇帝平遼碑在南城豐宜門外金史臣韓昉撰宇文虛中書十丈豐碑勢倚空風雲猶憶下遼東百年功業秦皇帝一代文章太史公石斷龍鱗秋雨後苔封鼇背夕陽中行人立馬空惆悵禾黍離離滿故宫梅花莊為張式良賦處士山莊浙水涯一林寒玉映窗紗詩成稚子能題竹酒熟鄰翁約看花雪夜叩門非俗客月明吹笛是誰家肯招白鶴山前住石鼎春泉看煮茶送陳鍊師奉香歸四明慶醮玉皇閣寄王致和真人黃帕奩香出禁闈東南草木盡光輝真人擁節三天候使者乘槎八月歸碧海烟霞浮曉閣瑶壇風露溼秋衣山中芝草還分得贈我能令白髮稀讀汪水雲詩集水雲汪元量字大有錢塘人以善琴受如宋主國亡奉三宫留燕甚久世祖皇帝嘗命奏琴因賜為黃冠師南歸時幼主瀛國公福王平原郡公趙與芮駙馬右丞楊鎮故相吳堅留夢炎參政家鉉翁文及翁提刑陳杰青陽夢炎與宫人王昭儀清惠以下草有九人分韻賦詩以餞其行水雲之詩多紀其國亡時事與文丞相獄中倡和之作文丞相又與馬丞相廷鸞章丞相鑑鄧禮部光薦謝國史枋得劉太傅辰翁序其詩集劉公又為批㸃余間聞危太史言曰水雲長身玉立修髯廣顙而音若鴻鐘南歸數來往匡廬彭蠡之間若飄風行雨世莫能測其去留之蹟江右之人以為神仙多畫其象以祠之象至今有存者其諸公所賦墨蹟嘗見於臨川僧舍云及豫至京師因徐君敏道得水雲集讀而哀之偶成二律以識其後三日錢塘海不波子嬰繫組納山河兵臨魯國猶弦誦客過殷墟獨嘯歌鐵馬渡江功赫奕銅人辭漢淚滂沱知章喜得黃冠賜野水閒雲一釣蓑一曲絲桐奏未休蕭蕭笳鼓禁宫秋湖山有意風雲變江水無情日夜流供奉自歌南渡曲拾遺能賦北征愁仙人一去無消息滄海桑田空白頭七月十六夜海上看月樓船留客宴涼宵坐看氷輪出海潮却憶去年灤水上夜深孤館雪蕭蕭去年客上京是日大雪征人七月度榆關貂鼠裁衣尚怯寒不信江南今夜月有人揮扇著氷紈陵州日落陵州路沿流古岸傍泊舟人自語聽雨夜偏長過客愁聞盜荒村久絶糧何人肯憂國得似董賢良董仲舒陵州人鄆城題壁髙樓緑樹帶斜暉十二街中過客稀憶著湧金門外住畫船湖上未曽歸賈客金多夢不成窗前葉落自心驚可憐遊子囊羞澀夜半長歌看月明寄上京塗貞大駕清秋發千官八月歸風髙沙鴈起霜落海鷹飛朝士誰青眼山人尚白衣最憐東魯客相望思依依月彥明都水月石研屏蓋歐陽公故物也小屏龕石置行窩素月分眀漾海波玉鑑澄輝涵碧樹青蘋流影入銀河紫雲硯側文章潤畫舫齊中歲月多最喜能詩蒼水使夜窗留客賦長歌寄程仲能挍書臺閣諸公百慮並郎官獨數挍書清水分玉漏更籌正天逼銅儀象緯眀帝座曉瞻雲縹眇靈臺夜候月崢嶸五星見說奎躔聚急草封章奏太平寶林八詠為别峯同禪師賦千仞琅邪石飛來鎮越州江波欲浮動還被白雲留飛來峯獨上峯顚塔秋清曙色開馮䦨望東北潮向海門來應天塔大布僧伽衲流傳六百年攜來香滿袖猶是御罏烟大布衣鐵鉢溪頭洗氷花六月寒山僧偶彈舌引得老龍蟠鐵鉢盂錫杖虛空落靈泉發地中忽看流菜葉始信石橋通羅漢泉甃石瀦山溜蜿蜒竹色青風來倐涼冷雨氣隔林腥靈鰻井一笏清涼地森森萬玉齊月明時倚杖問看鳯來棲深竹堂石磴藤花落山窗嵐氣浮晚來髙樹暝一榻似新秋盤翠軒嶽墳行守墳觀禪師至京請加封諡徵賦此宋將孟珙滅金捷回金陵命軍士屎溺秦檜墓上嶽王烈烈真丈夫材兼文武唐漢無平生許國膽如斗誓清九廟迎鸞輿十萬精兵多意氣赴難勤王盡忠義將軍閫外圖中興丞相江南請和議東京百戰方解圍班師詔促事還非父老吞聲仰天哭兒郎含憤渡河歸感激英雄竟誅害萬里長城真自壞但將淮水作邊關淮河之北為他界百年古廟近荒墳夜深石馬戰秋雲簫鼓時來謁祠下遺民猶泣舊將軍君不見滅金孟珙誇驍勇凱還兵薄秦家隴六軍溷穢積如山千古行人呼糞塜田家留客圖為四明劉師向先生賦客來田家當六月主人相留樹邊歇呼兒牽馬飲清泉厨裏新漿解君熱郎君出城幾日前城中米價今幾錢昨夜南村三尺雨不知還到城壕邊勿厭儂家茅屋小棘門新編土墻繞明朝蚤飰莫匆匆雞鳴送君出官道讀揭文安集公字曼隕豫章人撰明廟神御殿碑賜楮幣萬緡白金五十兩白鶴江頭夢窅然焚香燈下讀遺編憂時論議泉傾峽載道文章日麗天先帝樹碑勤述德大臣草制聽傳宣皇天不負斯人意今見才華屬象賢祕閣初開拜授經除書爭喜得公名御牀奏疏丹心在清夜悲歌白髮生謝病長懷髙士志育材端有古人情百年師道今寥落空使諸生憶老成文穆處士鄭君挽詩廣信鄭咺宣伯之父昔讀滎陽譜嘗聞左押牙系傳唐相國世作宋名家喬木流風在徵君述德遐消搖謝簮紱辛苦力桑麻種橘逾千户藏書過五車春潮生酒甕夜雨落鐙花太史占星殞長沙歎日斜諡從張籍定銘豈蔡雍誇令子名方振諸孫學更嘉他時五雲誥泉壤被光華題匡禪師看雲亭禪房花竹晝冥冥白髮匡公住草亭禹穴南來秦樹碧舜江東下蜀山青猿啼石壁松隂暝龍出溪潭雨氣腥有約春山尋勝事扶藜共讀栁州銘送楊梓人待制出守閬州兼寄嘉定宣慰家兄簮筆三年侍禁林分符還向蜀江潯莫雲盡處峨睂出春雪消時灌口深鈴閣雕盤香冉冉臺門畫㦸晝森森錦屏山下多遺蹟好覔城南老杜吟朱轓五馬出王庭父老西南望福星家世久聞清白吏文章爭誦太𤣥經岷江水落嘉魚美劔閣春晴榿木青若過睂州見蘇子卯君京國尚飄零東坡稱子由為卯君送楊季子赴德慶知事天祿揚雄久挍書忽聞章綬綰銀魚一官逺赴諸侯幕六轡先乘使者車椰子剖漿霜落後荔枝封蜜雨晴初故人只守平生業一研相求不願餘八月秋髙海月明年年夀斝得同傾喜君馬上青雲逺念我鐙前白髮生尚論古人多感慨間憂時事各牽情羅浮山下梅花發驛使來時好寄聲馬德良下第三月都門鶯亂飛東風客館思依依樂生空受昭王聘蘇子深慚李豸歸白璧人間須待賈青藜天上更分輝瓊林花發重來日五色春雲照錦衣寄河南趙子期參政中書重拜郭汾陽特遣臺臣鎮大梁汲黯匡君惟卧治倪寬飾吏用文章大隄日落黃河滿畫省春深緑樹涼梁梀全材今屬望早歸帝室構眀堂羽林行羽林將軍年十五盤螭玉帶懸金虎黃鷹白犬朝出遊翠管銀箏夜歌舞珠衣繡帽花滿身鳴騶斧鉞驚路人東園擊毬誇意氣西街走馬揚飛塵湖南昨夜羽書急詔趣將軍逺迎敵寶刀繡澀金甲寒馬上仿偟苦無力美人牽衣哭向天將軍執别淚如泉安得天河洗兵甲坐令嶺海無塵烟君不見關西老將多戰謀數竒白髮不封侯據鞍矍鑠尚可用誰憐射虎南山頭贈韓印曹歸會稽字元之疏其長官奸狀至都堂大臣竟繳回繇是得罪今昭雪還鄉韓君竒男子意氣凌秋旻峩峩步搖冠玉雪映長身談鋒勇無敵籌䇿捷有神讀書恥沿襲投筆棄里鄰翺翔黃金臺慷慨傾縉紳開口論利害不避讐與親爭欲出門下薦剡相交陳和林控大漠天髙地無垠宗王錫茅土蕃閫多重臣帶甲四十萬車廬日轔轔詔設大宗正撫綏播湛恩長官挾權勢淫刑虐邊民椎剝盡膏血遊畋徹昏晨君時主印綬裂眥忿且瞋陳書上東閣願言達楓宸丞相驚吐舌羣僚汗沾巾小臣敢訕上封章竟沈淪攟托舞文法蒼蠅㸃貞珉同列憤揮涕將佐含悲辛青天日慘淡愁雲夜氤氲皇皇繡衣使執法推忠循揚言力辨雪抑滯一朝伸旦夕受殊擢言歸念鱸蓴薔薇滿東山芙蕖映湖濵白酒溢春甕髙堂盡嘉賔剪燭悅情話牽衣叙親姻丈夫負竒氣終當追古人張儀口有舌范叔豈長貧攬鏡歎勳業天運無停輪念我客京邑漂零六徂春髙歌送君别握手金河津因之懷東越扁舟理絲綸張仲舉危太朴二翰林同擢太常博士南宫夜直擁青綾二妙容臺喜共登瑚璉久知清廟器階銜聯署玉壺氷後來博士如公少今日先生自此升見說圜丘將大饗百年禮樂正當興金臺集卷二
