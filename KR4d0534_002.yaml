body:
  text: 金臺集卷二元納延撰發大都上京紀行南陽有布衣杖䇿遊帝鄉憂時氣激烈撫事歌慨慷天髙多霜露嵗晏單衣裳執手謝親友驅馬出塞疆雲低長城下木落古道傍憑髙眺飛鴻離離盡南翔顧我逺遊子沈思鬱中腸更涉桑乾河照影空仿偟劉蕡祠唐劉蕡幽州昌平人謫死栁州歷遼金無能發濳德至本朝天厯間昌平驛官宫祺始奏建劉諫議書院入郭日已暝慘淡風葉赤鞠躬荒祠下低回想遺直劉君素忠憤伏闕論邦國痛陳腹心禍竟罹考功斥餘子盡鶱騰鬱鬱負慚色鄉人仰髙誼千載崇廟食悲歌風蕭蕭感慨情惻惻出門無行人涼月照東壁龍虎臺大駕巡幸往返皆駐蹕臺上晨登龍虎臺停驂望居庸絶壑閟雲氣長林振悲風翠華有時幸北狩甘泉宫千官候鳴蹕萬騎如飛龍帳殿駐山麓羽葆羅雲中我行避馳道弗得窮幽蹤衣裘倏涼冷積霧浮空濛前山風雨來驅鞭復匆匆居庸關關北五里今敕建永眀寶相寺宫殿甚壯麗三塔跨於通衢車騎皆過其下疊嶂緣青冥峭絶兩崖束盤盤龍虎踞岑巘互回伏重關設天險王氣輿坤軸皇靈廣覆被四海同軌躅至今豪俠人危眺屢驚縮﨑嶇棧閣峻縈紆岡澗曲環村列虛市鑿翠構廬屋溪舂激巖溜山田雜稌菽絶頂得幽勝人烟稍聯屬浮圖壓廣路臺殿出層麓白雲隱疏鐘落日帶喬木豈須歎蜀道政可夸函谷居人逺念我叩馬苦留宿恐辜殷勤情解鞍看山瀑榆林出關喜平曠前林樹扶疏微茫候烟火參差見廛廬美人秋水上娟娟映芙蕖巷隘車騎塞山寒日將晡行人問旅舍投鞭息馳驅張燈秣駑馬斷櫪餘青芻夜涼衾裯薄悒悒愁前途雞鳴山窗曙去矣毋躊蹰槍竿嶺山腰長城遺跡尚存飲馬長城下水寒風蕭蕭遊子在絶漠仰望浮雲飄前登槍竿嶺岡岑鬱岧嶤崩崖斷車轍曾梯入雲霄幽龕構絶壁微徑紆山椒人行在木末日落聞鳴蜩履險力疲苶憑髙思飄颻何當脫羈鞅歸種南山苖李老谷谷中多杜鵑髙秋逺行邁入谷雲氣暝稍稍微雨來漸怯衣裳冷縈紆青崦窄杳窱烟林迥峯回稍開豁夕陽散微影霜葉落清澗寒花媚秋嶺途窮見土屋人烟雜虛井平生愛山癖愒此愜幽靜月落聞子規懷歸心耿耿赤城金閣山在赤城西郊洞眀真人修鍊之所山中盛産青李來禽諸果休駕赤城館憑軒望前山飛雨西北來亂灑石壁間風寒樹摵摵氷落沙斑斑牛羊盡歸柵微鐙掩松關野老頗留客及此農事閒傾筐出山果濁酒聊尉顔移尊對金閣靈宫鬱孱頑安得吹蕭人乘鸞月中還龍門元統間知樞密院事都哩特穆爾過峽中見二羊鬬山椒頃刻大雨水溢姬妾輜重皆為泄溺崢嶸龍門峽曠古稱險絶疏鑿非禹功開闢自天設聨岡疑路斷峭壁忽中裂雲蒸雨氣暝石觸水聲咽羸驂涉溝澗執轡屢愁蹶憶昔兩羝羊忿鬬蛟龍穴暴雨忽傾注淫潦怒奔決人馬多漂流車軸盡摧折我行愁隂霾慘慘情不悅日落樵唱來三歎腸內熱獨石國朝諸后太子陵皆在獨石北氊帽山停驂眺青林獨石當廣路峩峩龍君祠殿屋隱朝霧前山過微雨暝色起髙樹溪灣夕溜清巖竇寒雲聚東園有陵寢龍虎蔚盤據行人下馬過斂袵夙驚愳凉風吹華髮感激歲年莫悵望南天雲裴徊不能去檐子窪昔多盜賊今置巡撿司于山椒其山無林木皆蔓草朝發牛羣頭夕憩檐子窪髙秋得清曠野蔓多幽花黃雲翳日腳草色浮天涯山荒樹寂寞寒陂落昏鴉頗喜盜賊清塞田盡禾麻至今將軍壘日落聞清笳我生久羈旅﨑嶇涉風沙天寒道路逺曛黑投山家李陵臺落日關塞黑蒼茫路多岐荒烟淡莫色髙臺獨巍巍嗚呼李將軍力戰陷敵圍豈不念鄉國奮身或來歸漢家少恩信竟使臣節虧所愧在一死永為來者悲千載撫遺蹟憑髙起遐思褰裳覽八極茫茫白雲飛次上都崇真宫呈同遊諸君子雞鳴涉灤水慘淡望沙漠穹廬在中野草際大星落風髙馬驚嘶露下黑貂薄晨霞發海嶠旭日照城郭嵯峨五色雲下覆丹鳯閣琳宫多良彥休駕得棲泊清尊置美酒展席共歡酌彈琴發幽懷擊筑咏新作生時屬承平幸此帝鄉樂願言崇令德相期保天爵錫喇鄂爾多觀詐馬宴奉次貢泰甫授經先生韻詔下天門御墨題龍岡開宴百官齊路通禁籞聮文石幔隔香塵鎮水犀象輦時從黃道出龍駒牽向赤墀嘶繡衣珠帽佳公子千騎揚鑣過栁隄珊瑚小帶佩豪曹壓轡鈴鐺雉尾髙宫女侍筵歌芍藥內官當殿出蒲萄柏梁競喜詩先捷羽獵爭傳賦最豪一曲霓裳才舞罷天香浮動翠雲袍繡綺新裁雲氣帳玉鉤齊上水精簾鳯笙屢聽伶官奏馬湩頻煩太僕添風動香烟飄闔殿日扶花影上雕檐金盤禁臠才供膳階下傳呼索井鹽上林宫闕淨朝暉宿雨清塵暑氣微玉斧照廊紅日近霓旌夾仗彩霞飛錦翎山雉攢遊騎金翅雲鵬織賜衣宴罷天階呼秉燭千官爭送翠華歸灤河涼似九龍池清暑年年六月時孔雀御屏金纂纂棕櫚别殿日熙熙青藜獨喜頒劉向黃閣重聞拜子儀千載風雲新際㑹願將金石播聲詩時太傅托克托公再入相位病中答張元傑宗師惠藥卧病臨髙館丹芝幸見分銅瓶朝挹水石鼎夜生雲坐久鐙華落秋清木葉聞眀朝得强健長禮紫虛君崇真宫夜望司天臺珠宫灤水上軒窗白雲開中宵聽落葉似是風雨來褰衣視星象歷歷環天臺我將攬河漢乘槎共裴回雨夜同天台道士鄭䝉泉話舊併懷劉子彞蒙泉時奉祠上京崇真宫子彝嘗於四明東湖築天壇道院以待蒙泉東歸履雪台州老鄭䖍相逢灤水話當年草堂聽雨秋將半石鼎聨詩夜不眠遙憶東湖來夢裏起看北斗落窗前劉郎獨愛長生訣日日天壇待鶴還陽明洞丁元善尊師攜酒招省郎穆薩君過余夜飲仙人釀松華留客中夜酌微風樹間來細雨鐙前落清詩憶彌眀髙興懷康樂移尊過西軒匡坐聽笙鶴行路難至正已丑夏右相多爾濟公拜國王就國遼東是日左相賀公亦左遷因感而作行路難難行路黃榆蕭蕭白楊莫槍竿嶺上積雪髙龍門峽裏秋濤怒嵯峩虎豹當大關蒼崖壁立登天難千車朝從赤日發萬馬夜向西風還鑑湖酒船苦不蚤遼東白鶴歸華表夜雨空階碧草深落花滿院行人少世情翻覆如秋雲誓天歃血徒紛紛洛陽爭迎蘇季子淮隂誰識韓將軍行路難難行路白頭總被功名誤南樓昨夜歌舞人丹旌曉出東門去子午谷終南山青松草屋相對閒拂衣髙歌上絶頂請看人間行路難塞上曲秋髙沙磧地椒稀貂帽狐裘晚出圍射得白狼縣馬上吹笳夜半月中歸雜遝氊車百輛多五更衝雪渡灤河當轅老嫗行程慣倚岸敲氷飲驝駝雙鬟小女玉娟娟自捲氊簾出帳前忽見一枝長十八折來簮在帽簷邊長十八草花名馬乳新挏玉滿瓶沙羊黃鼠割來腥踏歌盡醉營盤晚鞭鼓聲中按海青烏桓城下雨初晴紫菊金蓮漫地生最愛多情白翎雀一雙飛近馬邊鳴歸途過金閣山懷虞侍講羸驂八月過雲州殿閣嵯峩疊嶂稠空谷無人黃葉落白雲如雪滿溪流獨登金閣尋仙蹟還憶青城覔舊遊日落長歌下山去西風十里異香浮虞公過山下嘗聞異香十餘里讀唐媯川劉太守遺愛碣秣馬懷來縣摩挲古碣隂龜趺苔色暗篆畫雨痕深治蹟推天寶家聲紀卯金最憐名漫漶獨立久沈吟碑文皆完惟劉公之名剝落不可讀還京道中客遊倦緇塵夢寐想山水停驂眺逺岑悠然心自喜晨霞發暝林夕溜洄清沚出峽涼風馳入谷寒雲起霜清卉木疏日落峯巒紫迢遞越河關參差望宫雉家僮指歸路居人念遊子久嗟行路難深乖攝生理終期返南山髙揖謝城市海上幽人錦繡腸獨臨灤水惜年芳千金不賣長門賦閒寫新詩寄玉堂臨川危素敬題憶陪仙仗度關時玉帳星聮紫翠圍今日讀君天上曲依然環珮月中歸括蒼胡深敬題贈張直言南歸天子開明堂股肱任䕫禼四方多章奏俯伏陳陛闕臣聞黃河流洶洶怒衝齧巨野及青徐千里盡魚鱉載憂山東盜馮陵據巢穴腰弓入城市白晝肆攘敓嶺南失控御猺獷恣猖獗運餉山溪阻野戰瘴雲熱釁僰寇雲南兵禍久聯結誰憐酈生辨竟墮韓侯譎參政舒嚕存道事與酈食其同邊將多貪殘駝羊盡膏血南兵久孱懦海上縱狂孽租庸弊吳楚鹺征困閩浙文牘日冗繁民力愈疲竭詔下閶闔門求言補遺缺張君素忠憤意氣古豪傑裹糧涉江淮徒步犯霜雪伏謁中書堂揚眉吐竒說愚䇿十有六歷歷甚詳切儻䝉録一二亦足解鉗掣鯫生匪狂謬閣下幸裁決丞相屬春官分曹挍優劣翩然不俟報長揖與豫别言歸南山廬白雲可怡悅長溪釣魴鱮春山採薇蕨飰疏飲清泉終焉養髙潔賤子託深誼持觴候車轍既攄平生藴尚復鑒前哲劉蕡竟下第賈誼空嗚咽讀君囊中書捫君口中舌歌君白馬篇贈君蒼玉玦相期爛柯山笑濯澄潭月大元特進上卿𤣥教大宗師饒國吳公全節哀詩二十二韻延祐間命公返初服拜執政力辭不就止封其祖父皆饒國公賜其鄉曰榮祿里曰具慶特進天人間世英長身玉立氣崢嶸髙年幸際時熙洽盛德尤關國重輕柱史久聞周典禮留候多識漢公卿寓言有道皆心服論治無為顧力行天子欲煩黃閣寄山人自負白衣名鄉閭表異絲綸渥茅土疏封黼黻榮萬里函香祠五嶽頻年載筆賦三京尚方賜舄蠙珠絡內膳分庖翠釡烹棕殿說經揮麈拂竹宫望拜候鸞笙榜懸髙閣宸章妙碑賜仙壇瑑刻精寶劍叱龍山雨至鐵符誅怪海潮平華編盡許氷壺潔藻鑒難逃水鏡清臺閣從遊多故舊王侯趨事儼神明萬全自保惟謙抑一諾端能託死生開户圖書聮竹色下階環珮雜松聲學窮河洛知休運誼薄雲天見古情入室有人傳印綬升堂無客不簮纓每慚賤子依琳館長憶髙秋醉玉觥絳節才聞朝上帝石棺俄報瘞佳城神仙自古稱豪傑朝著于今憶老成官舫涼風吹畫翣大江飛雨濕丹旌何年下馬墳前過一束生芻淚盡傾公自龍虎臺接駕還即捐館命給傳舟歸葬河圖仙壇南城詠古十六首有序至正十一年秋八月既望太史宇文公太常危公偕燕人梁處士九思臨川黃君殷士四明道士王虛齊新進士朱夢炎與余凡七人聯轡出遊燕城覽故宫之遺蹟凡其城中塔廟樓觀臺榭園亭莫不裴佪瞻眺拭其殘碑斷柱為之一讀指其廢興而論之豫七人者以為人生出處聚散不可常也解后一日之樂有足惜者豈獨感慨陳蹟而已哉各賦詩十有六首以紀其事庶來者有所徵焉河朔外史納新序黃金臺大悲閣東南隗臺坊內落日燕城下髙臺草樹秋千金何足惜一士固難求滄海誰青眼空山盡白頭還憐易河水今古只東流憫忠閣唐太宗憫征遼士卒陳亡而建髙閣秋天迥金仙寶珞齊青山排闥見紫氣隔城迷朱栱浮雲溼雕簷落照低因懷百戰士惆悵立層梯壽安殿殿基今為酒家壽安樓夢斷朝元閣來尋賣酒樓野花迷輦路落葉滿宫溝風雨青城暮河山紫塞愁老人頭雪白扶杖話幽州聖安寺寺有金世宗章宗二朝象蘭若城幽處聮鑣八月來寶華􅓚蓋合衮冕畫圖開斷碣蒼苔暗空庭落葉堆饑鳶不避客攫食下生臺大悲閣閣榜虞世南書閣道連天起丹青飾井幹如何千手眼只著一衣冠金榜交龍挾雕甍吻獸攢馮髙天萬里白紵不勝寒鐵牛廟燕人重東作鎔鐵象牛形角斷苔華碧蹄穿土繡腥遺蹤傳野老古廟托山靈一酹壺中酒穰穰黍麥青雲仙臺金之望月臺臺殿青冥外團團海月涼隔簾聞鳯管秉燭奏霓裳銅爵晨霞眩金盤夕露瀼仙人不復返愁殺海生桑長春宫全真丘神仙處機之居太祖嘗召至西域之雪山講道屢勸上以不殺羸驂踏秋日迢遞謁琳宫松子花甎落溪流板閣通樓臺非下土環珮憶髙風草昧艱難日神仙第一功竹林寺金熙宗駙馬宫也寺僧云一塔無影城南天尺五祗樹給孤園甲第王侯去精藍帝釋尊老僧誇塔影稚子斫松根何日天台路相從一問源龍頭觀龍頭懸一牙籖刻曰建隆