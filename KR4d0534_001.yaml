遊羸驂短褐風颼颼昭王臺前月似水荆卿驛畔天如秋病骨苦寒情苦倦南下黃河疾於箭清晨雙櫓發吕梁黃昏已泊桃源縣生來每歎蜀道難去年我亦登蒼山馮公嶺頭日不到肩輿履雪梯孱顔僕夫緣崖如凍蟻下俯鐔山深澗底人家半出松樹頂白雲却在山腰起今年四月江西歸小姑正對彭郎磯三更掛帆海門過一川草樹浮晴暉我生胡為自役役孟浪江湖竟何益清霜鏡底縈鬢絲坐對篝燈空嘆息愁來鬱鬱不可當結交賴有張家郎臨風同歌紫芝曲掃石大醉黃金觴我家南陽天萬里十年不歸似江水秋來忽作故鄉思裹劍囊衣渡揚子玩鞭亭下江縈紆淮山楚樹青扶疏一帆西風出巢縣眼明墮此清氷壺湖水漫漫接天杪天低更覺青山小倦飛沙鳥戞漁艇倒景芙蓉涵碧藻涼波不動舟如飛棹歌窅窅聲相隨江東雲樹轉頭失淮西山水尤清竒故人江南不可見千里相思情眷戀門外梅花知未發屋頭柿葉題應遍期君不來爭奈何青天落日搖滄波明年歸來貿山下與君共讀巢湖歌易之詩中所歷之景豫皆嘗過之所未至者巢湖耳易之有此清雄峻拔之句余無一語者人各有能有不能也太常博士危素書梨花白頭翁圖為四明應成立題淡月溶溶隔畫樓一枝香雪近簾鈎山禽似怨春歸早獨立花間自白頭送都水大監托克托清卿使君奉命塞白茅決河黃河洶洶決中州三䇿深煩賈讓謀時用工部尚書賈魯之議聖主憂勤過舜禹相君勛德並伊周渠通故道魚龍避木斬空山虎豹愁十七萬人齊舉鍤一千餘里總安流皇天蚤出圖書瑞赤子行歌黍麥秋白璧遣官祠嶽瀆黃金當殿賜公侯使君世重無雙論太史功書第一籌繡衮從今登兩府更將忠孝輔皇猷汝水天兵與宋合攻蔡州城既破金右丞完顔仲德率將士六百人突圍遁至汝水回顧城中煙焰漲天仲德下馬謂將士曰國已亡余居宗室且備位宰相義固當死諸公宜早降諸將大譟曰相公能死我輩獨不能死耶六百人皆奮然赴水死騎馬涉秋水泠泠戰骨聲寒沙沈斷㦸殺氣暗殘營自欲全忠義誰能顧死生千年董狐筆端不愧田橫送平章扎拉爾公多爾濟巴勒字惟中赴西臺御史大夫太師功德古無倫相國材名冠薦紳諤諤敢言天下事堂堂能服世間人騎迎曉日旌旗動衣繡春雲黼黻新賤子平生蒙奬譽棄繻從此入西秦郟城冬夜讀書有感幽窗悄無寐稍覺塵慮清月色下牀頭映我書册明微燈照孤影慨彼華髮生永懷古先哲勞心但營營送蔣伯威下第南歸象山黃榜天門曙色分考功深愧失劉蕡競誇蜀錦新機杼誰識商盤古篆文小艇歸人衝夜雨落花離思攪春雲故廬鐵硯應無恙載筆重來勇䇿勛羅稚川山水十韻為甬東應可立題平生丘壑趣偶向畫中傳雨氣千峰外江流落日邊䕷蕪青滿渚芳樹緑參天渺渺溪雲淨涓涓石溜縣崖顛何處閣谷口小家煙漁唱來秋浦僧鐘落夜船瞥驚飛鳥過疑有蟄龍眠竹徑能留客桃源竟得仙丹青夸絶代賦詠藉名賢千古滄洲意含情憶稚川題畫扇送蘭石奉御遊上京居庸煙樹緑扶踈公子頻年從屬車聞說千金求作賦上林須薦馬相如潁州老翁歌潁州老翁病且羸蕭蕭短髮秋霜垂手扶枯笻行復卻操瓢丐食河之湄我哀其貧為顧問欲語哽咽吞聲悲自言城東昔大户腴田十頃桑隂圍闔門老稚三百指衣食儘足常熙熙河南季來數亢旱赤地千里黃塵飛麥禾槁死粟不熟長鑱掛壁犂生衣黃堂太守足宴寢鞭撲百姓窮膏脂聒天絲竹夜酣飲陽陽不問民啼饑市中斗粟價十千饑人煮蕨供晨炊木皮剝盡草根死妻子相對愁雙眉鵠形纍纍口生焰臠割餓莩無完肌姦民乘隙作大盜腰弓跨馬紛驅馳嘯呼深林聚凶惡狎弄劍槊搖旌旗去年三月入州治踞坐堂上如熊羆長官邀迎吏再拜饋進牛酒羅階墀城中豪家盡剽掠况在村落人煙稀裂囊剖筐取金帛煮殺雞狗施鞭笞今年災虐及陳潁疫毒四起民流離連村比屋相枕藉縱有藥石難扶治一家十口不三日藁束席卷埋荒陂死生誰復顧骨肉性命喘息縣毫釐大孫十歲賣五千小孫三歲投清漪至今平政橋下水髑髏白骨如山崖繍衣使者肅風紀下車訪察民瘡痍緑章陳辭達九陛徹樂减膳心憂危朝堂雜議㑹元老恤荒討賊勞深機山東建節開大府便宜斬揚天威親軍四出賊奔潰渠魁梟首乾坤夷拜官納粟循舊典義士踴躍皆歡怡淮南私廪久紅腐轉輸豈惜千金資遣官巡行勤撫尉賑粟給幣蘇民疲獲存衰朽見今日病骨尚爾難撐持鄉非聖人念赤子填委溝壑應無疑老翁仰天泪如雨我亦感激愁歔欷安得四海康且阜五風十雨斯應期長官亷平縣令好生民擊壤歌清時願言觀風采詩者慎勿廢我潁州老翁哀苦辭狀物寫景之工固詩家之極致而繄於風化補於政治尤作者之至言易之此詩兼得之矣禮部侍郎汝隂李黼子威書易之此詩格調則宗韓吏部情性則同元道州世必有能知之者監察御史危素書至正四年河南北大饑明年又疫民之死者過半朝廷嘗議粥爵以賑之江淮富人應命者甚衆凡得鈔十餘萬錠粟稱足㑹夏小稔賑事遂已然民罹大困田菜盡荒蒿蓬沒人狐兔之迹滿道時余為御史行河河南請以富人所入錢粟貸民具牛種以耕豐年則收其本不報覽易之之詩追憶往事為之惻然八年三月翰林待制武威余闕志金臺集卷一
