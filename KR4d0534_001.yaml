body:
  text: 金臺集卷一元納延撰登崆峒山緣蘿陟層巘曠望浮雲馳飄風西北來颯颯吹裳衣氣候倏遷變中懷鬱歔欷路逢一道士髙結冠巍巍恐是廣成子再拜欲問之長歌入深林棄我忽若遺哀湍瀉石磴日落松聲悲雲蹤邈難及千載生遐思賦環波亭送楊挍勘歸豫章季子積水敞華構參差帶幽壑微風動輕蘋緑雲泛珠箔天空夕隂斂川迥游鱗躍徘徊滄洲夢露下翠衾薄公子屬鳴珮逍遙陟延閣微吟省樹移緩步庭花落放舟返春渚言恣林泉樂揮觴靡可留悵望青山郭送蔡樞密仲謙河南開屯田兼呈偰工部世南峩峩臺閣五朝臣兩府承恩雨露新百鍊丹心惟報國一簮華髮為憂民山東豺虎無餘孽雒下桑麻及暮春解劔從今買黃犢去思應與芍陂鄰上樞秉鉞慰中州更喜尚書並轡遊龍節引班辭玉陛羽觴傳酒送華輈晴雲冉冉浮宫樹春水粼粼出御溝蚤晚歸朝奏勛績君王須賜紫貂裘三峰山歌鈞州陽翟縣南有山曰三峰昔我睿宗在邸嘗統兵伐金與其三將完顔哈達伊喇布呼完顔錫里等鏖戰山下敗其軍三十萬而金亡矣今百餘年樵牧往往於沙礫中得斷矟遺鏃印章之類至正五年嘉平第二日豫自郟城將上京師道出陽翟夜宿中書郎郭君彥通私館感父老之言而作歌曰落日慘淡黃雲低懸崖古樹攢幽溪三峰山頭獨長嘯立馬四顧風凄凄溪邊老翁行傴僂勸我停驂為君語山前今日耕種場誰識當年戰爭苦金源昔在貞祐間邊塵四起民凋殘燕京既失汴京破區區恃此為河山大元太子神且武萬里長驅若風雨鏖兵大雪三將死流血成河骨成堵朱鸞應瑞黃河清金將亡新鄉河清鼓山鳯出應國朝開基之兆聖人啓運乾坤寧當時流離别鄉井歸來白髮歌承平曠野天寒霜簌簌夜靜愁聞山鬼哭至今隴上牧羊兒猶向草根尋斷鏃論功衛霍名先收黃金鑄印身封侯英雄半死鋒鏑下何人酹酒澆荒丘余比修國史睹三峰之役金師三十五萬來拒戰我師不敵軍于山之金溝其軍數重圍三峰而中夜大雪金人戈㦸弓矢凍纒莫能施我師一鼓殱之自是金人膽落不復戰矣易之作歌辭豪健激昂而奕奕有思致殆與三峰長雄置諸樂府鐃歌間揚厲無前之盛績良無愧也晉寧張翥題京城燕京城燕子三月盡方至甫立秋即去有感而作三月京城寒悄悄燕子初來怯清曉河隄柳弱氷未消墻角杏花紅蕚小主家簾幕重重垂銜芹却傍檐間飛託巢未穩井桐墜翩翩又向天南歸君不見舊時王謝多樓閣青瑣無塵捲珠箔海棠華外春雨晴芙蓉葉上秋霜薄題羅小川青山白雲圖為四明倪仲權賦山上晴雲似白衣溪頭竹樹緑隂圍野橋日落行人倦茆屋春深燕子飛漉酒屢招鄰舍飲放歌還趂釣船歸客窗看畫空愁絶便欲移家入翠微答朱景明惠墨兼次韻春去思家逺愁來似酒醺故人多古意賤子豈能文搦管含春黛臨池漲溼雲欲窮山水興分贈李將軍京城春日二首三日諸郎儤直閒繞城騎馬借華看晚來金水河邊路柳絮紛紛撲繡鞍黃鶴樓東賣酒家王孫清曉駐游車寶叉換得蒲萄去今日城東看杏花送王季境還淮東幕西京驕馬越羅衣公子風流世絶稀冠蓋一門誇萬石江山千古憶𤣥暉新茶夜試中泠水美酒春分采石磯幕府羣公多勝賞一枝芍藥待君歸益清堂閩海憲使哈魯桓穆公歸休嵩山之下鑿池引流列植卉木扁其燕處之堂曰愛蓮公沒堂池逮廢其孫國子生張閭伯髙謙恭好學思繼先志乃復增葺而新之國子先生陳伯敷易其名曰益清伯髙謂豫曰與君世寓南陽且支裔聨屬不可無作因賦律詩十有四韻以復其命云嵩嶽雲峰近髙居水竹幽築堂依别墅甃石帶芳溝翠荇含風弱紅蕖著雨柔菱歌花外發蘭槳月中游卷幄紅雲亂開尊碧露浮使君曽弭節持斧照南州緑野池臺莫平泉草樹秋吾宗多秀發公子獨清修屢接何蕃武長懷賈誼憂拾螢供夜讀走馬散春愁朋友頻相過琴觴每倡酬籍通青瑣貴文擅胄闈優歸思勞清夢髙情憶故丘卜鄰端有約歲晚共綢繆送陳道士歸金華復初明月樓前溪水深溪邊樓觀隔松隂何時化鶴歸華表相對焚香坐竹林夜雨燈前閒讀易春風花底自彈琴令人苦憶江南路千里相思雪滿簪𤣥圃為上清周道士賦𤣥圃雲深路渺茫神仙飛佩隔榑桑碧桃開盡春溪漲白鶴歸來海月涼嵓澑涓涓鳴石竇松華細細落琴牀明年我亦山中去賸采瑶芝滿藥囊送王公子歸揚州玉雪王公子歸韉向竹西水清淮白上天濶海青低瓊樹春前發烏絲醉後題何須問勛業名與爾翁齊題張萱美人織錦圖為慈溪蔡元起賦織錦秦川窈窕娘新翻花樣學官坊窗虛轉軸鸚聲滑腕倦停梭粉汗香雙鳯回翔金縷細五雲飛動綵絲長明年夫壻封侯日裁作宫袍逺寄將題崇真宫陳練師壁間竹梅邀倪仲愷同賦空谷天寒雪如堵短篷載酒滄江浦繫船偶傍竹籬邊一樹梅花才半吐别來京國久相思夢斷愁聞畫角吹忽見新圖寫幽趣令人却憶剡溪時寄語南城倪博士取琴對此彈秋水中林月上不須歸共倒清尊醉花底春日次王元章韻翠幰金車錦駱駝芙蓉繡褥載雙娥雨晴輦路塵沙少風起春城柳絮多秉燭且留清夜飲倚䦨猶聽隔墻歌山翁此日心如水夢斷江南雨一蓑送葉上舍晉歸四明涼空夕隂霽繁星烜明河夜色浩如水秋聲在庭柯遊子千里情歸心向江沱亭亭太白巘窅窅煙雲多落月掛松檜古屋依清波結縭豈不蚤流光恐蹉跎振衣出橋門晨興理征艖清淮集魴鯉曠野飛駕鵝顧我羈旅間執别將如何持觴易水上慷慨驪駒歌逺眺東南山鬱鬱雲嵳峩程叔大歸四明兼簡徐仲裕銀臺門裏挍書時金匱親函拜衮衣賜酒喜從天上至乘槎還向月中歸滄江水落孤帆逺野岸秋深亂葉飛若到蓬萊見徐市相思千里政依依題吳照磨墨梅天台吳架閣京下憶尋梅倚杖月中立思君江上來夜深憐雪落香動覺春回獨坐溪邊石夝雲滿緑苔和危太朴撿討葉敬常太史東湖紀遊柳外旌旗拂曙光使星迢遞下江鄉岸花送客烏篷逺山雨催詩翠閣凉老衲自分茶竈火小僮深炷石龕香故人别去瀛洲逺千里披圖思儘長桃花山水圖為桃源屠啓明題天台山下雲無數山南山北多桃樹石洞春寒風雨深落花半逐溪流去人間從此識仙家短棹尋源到水涯翠袖乘鸞下明月玉槃留客進胡麻我昔捫蘿探幽谷青精煮飯松邊宿至今瞳子有神光細字猶能夜深讀髙人築屋石溪東溪山却與天台同粉黛含情託幽趣碧桃流水春溶溶六月黃塵汗如洗獨騎瘦馬京城裏忽見新圖雙眼明拏舟欲泛滄浪水我家只在蒼崖顛白雲繞屋清溪連他日君能逺相覔看花酌酒春風前春暉堂為武陟趙太守賦使君未老竟投簪新築華軒並故林寸草不忘東野念九泉猶慰北堂心窗浮海色晴雲薄日轉花隂午漏深展卷令人心獨苦蓼莪久廢淚霑襟題馬逺信州圖昔解靈溪纜相將下信州人家臨水岸鼓角起城頭雲積龜峰雨江分蠡澤秋開圖見山郭千里思悠悠送普顔子壽之廣西經歷子壽從駕自海南歸天子龍飛海上歸中郎執㦸最光輝雲間紫誥金書字幕下仙僚繡作衣萬里秋風榕葉暗一林新雨荔枝肥編氓政苦誅求急蚤望封章達禁闈送道士袁九霄歸金坡道院朔風吹黃沙客子夢千里青山久不歸白日去如水昨朝灤水上仙人偶徠過自言逺紛壒結廬在金坡玉峽棲曽雲翠閣縈危棧鐘聲繞碧壇桃花出深澗雙童掃白石展席彈瑶琴青松掛落月海色浮空林竟謝區中緣騎龍忽歸去秪恐人民非那愁歲年莫君還鍊石髓九轉成𤣥霜他時肻分贈碧落同翺翔送葛子熙之湖廣挍官髙槐疏雨作新涼猶記讐書白玉堂官燭夜分供細字宫壺曉賜出明光盤堆苜蓿青氊冷衣染檀花束帶長宣室若蒙天子問定知賈誼在沅湘南山木落氣蕭蕭千里歸心折大刀雙櫓鵝鳴秋水濶三關虎踞朔雲髙客窗久念衣裘薄史館頻煩筆札勞有約相逢明月夜扁舟載酒楚江臯送太尉掾潘奉先之和林御河氷消春欲暮官船繫著河邊樹河邊日日送行人撾鼓開帆盡南去潘郎作掾獨未還腰弓卻度居庸關馬上長歌一回首關南樹色青雲間七月金山已飛雪牛羊散漫行人絶夜深陡覺氊帳寒酒醒只聞笳鼓咽丈夫莫恨不封侯食肉須當萬里游腰間拂拭黃金印他日相逢尚黑頭送喀爾聞善之猗氏長子山平章從子名拜珠青絲白馬出京華乍剪宫袍眩海霞作宰不須辭下邑歷階從此擁髙牙小樓刻燭聽春雨白晝垂簾看落花見說三槐隂德厚孝亷還在相君家賦甘露門送李侍御之西臺惟中雉觀銀河近天清鼓角空女墻秋色外仙掌月華中雙闕當關樹髙城繞漢宫使君驄馬入按轡立西風送諳達巴哈萬户湖廣赴鎮三品新除萬户侯紅旗照海出皇州腰間寶帶懸金虎馬上春衫繡玉虬水落張帆遊夢澤月明撾鼓過南樓書生最喜從軍樂何日轅門借箸籌雪霽晚歸偶成公子腰弓下直歸紅門晚出馬如飛東街積雪無人掃却恨春泥濺繡衣東風悄悄著羅衫秉燭歸時酒半酣聽得隔簾人笑語夜來春氣似江南豫有山水圖留倪仲愷太史齊中久未得題品一日危太朴應奉謂余曰昔人皆以酒解酲子能作歌求詩亦此意也遂成古詩一章以趣之野人築屋青山底緑篠娟娟䕃秋水天涯作客想江南乞君題詩畫圖裏畫圖疊嶂雲鈎聨汀花碧草春依然對此令人動歸興却思把釣清溪邊一束殘書掛牛角大笑青天看日落窗下孤燈夜雨深人間萬事秋雲薄明年我亦去山隂君歸泛雪須相尋草堂下榻看圗畫共君酌酒聽君吟月湖竹枝四首題四明俞及之竹嶼卷絲絲楊柳染鵝黃桃花亂開臨水傍隔岸誰家好樓閣燕子一雙飛過墻五月荷花紅滿湖團團荷葉緑雲扶女郎把釣水邊立折得柳條穿白魚水仙廟前秋水清芙蓉洲上新雨晴畫船撐著莫近岸一夜唱歌看月明梅花一樹大橋邊白髮老翁來繫船明朝捕魚愁雪落半夜推篷起看天送太師掾陳德潤歸吳省親列㦸三槐第王章九錫臣鳴珂皆貴戚彈鋏盡嘉賔公府多甄録先生蚤見親下帷談亹亹開閣禮諄諄春甕蒲萄熟朝槃苜蓿新大夫欣契合丞相屢咨詢不厭甔無粟寧甘甑有塵寸心縣噬指千里動思蓴解袂燕臺下揚舲潞水濵岸花迎客帽雲樹暗江津捧檄娛親舍還家及暮春豈須誇祿養自可厚彞倫賤子漂零久經年旅食貧詩成空感激愧爾逺歸人送吳月舟之湖州教授天涯作客少清歡剪燭裁詩强自寬江樹莫雲離思逺杏花春雨客窗寒烏程美酒臨池酌罨畫青山拄笏看博士從來官獨冷團團朝日照空盤耕樂為張處士賦江東有一士耕穫在南山天明荷鋤出日暮唱歌還酌酒麥隴上掛巾桑樹間卒歲有餘樂豈知行路難送國子生郭鵬歸河東石室山省親學省沉沉近九天青藜曽得挍韋編諸生共惜何蕃去聖主深知郭隗賢石室人歸秋水落滹沱馬度曉氷堅一尊春酒髙堂上願祝仙翁五百年賦鸚鵡送偰世南廉使之海南朱崖擅珍鳥鸚鵡獨專名滿庭榕葉春晝晴飛來却向花間鳴三月蠻江春水緑日斜還傍江頭浴弱羽翻風溼翠流爪痕蹴浪珊瑚束間關更作斷腸聲水流花落難為情烏臺使君午夢醒隔簾細雨春冥冥江東魏元德進所製齊峯墨于上都慈仁殿賜文縑馬湩以寵之既南歸作詩以贈云錦襲𤣥圭瑩龍香祕閣浮漬豪春黛溼拂楮翠雲流繡綺頒宫掖瓊漿出殿頭小臣霑雨露千載荷恩休送李士寧之河南太守銅虎初分刺史符翩翩皂蓋入東都寒灘久伺占鸂鶒斷碣誰憐載轆轤鸂鶒灘井樁碑皆在洛陽雪裏行厨尋永叔花邊繫馬問堯夫漢庭擇相皆良吏佇􅩾黃麻出紫樞題㑹稽韓與玉秋山樓觀樓觀依青崦峰巒似越州樹根流水過山頂白雲浮露下琴絲潤溪寒釣石幽相看圖畫裏歷歷記曽